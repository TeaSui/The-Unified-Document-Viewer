services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docviewer
      POSTGRES_PASSWORD: docviewer
      POSTGRES_DB: docviewer
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docviewer -d docviewer"]
      interval: 2s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/pressly/goose:latest
    volumes:
      - ./migrations:/migrations
    command: ["-dir", "/migrations", "postgres", "postgres://docviewer:docviewer@postgres:5432/docviewer?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  sales-mock:
    image: wiremock/wiremock:3.10.0
    ports:
      - "9001:8080"
    volumes:
      - ./mocks/sales/mappings:/home/wiremock/mappings
    command: ["--global-response-templating"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 3s
      retries: 5

  service-mock:
    image: wiremock/wiremock:3.10.0
    ports:
      - "9002:8080"
    volumes:
      - ./mocks/service/mappings:/home/wiremock/mappings
    command: ["--global-response-templating"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://docviewer:docviewer@postgres:5432/docviewer?sslmode=disable"
      SALES_MOCK_URL: "http://sales-mock:8080"
      SERVICE_MOCK_URL: "http://service-mock:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sales-mock:
        condition: service_healthy
      service-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
