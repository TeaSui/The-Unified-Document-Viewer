services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docviewer
      POSTGRES_PASSWORD: docviewer
      POSTGRES_DB: docviewer
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docviewer -d docviewer"]
      interval: 2s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    volumes:
      - ./migrations:/migrations
    entrypoint: ["sh", "-c", "psql -f /migrations/init.sql"]
    environment:
      PGHOST: postgres
      PGUSER: docviewer
      PGPASSWORD: docviewer
      PGDATABASE: docviewer
    depends_on:
      postgres:
        condition: service_healthy

  sales-mock:
    image: wiremock/wiremock:3.10.0
    ports:
      - "9001:8080"
    volumes:
      - ./mocks/sales/mappings:/home/wiremock/mappings
    command: ["--global-response-templating"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 3s
      retries: 5

  service-mock:
    image: wiremock/wiremock:3.10.0
    ports:
      - "9002:8080"
    volumes:
      - ./mocks/service/mappings:/home/wiremock/mappings
    command: ["--global-response-templating"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/__admin/mappings"]
      interval: 2s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://docviewer:docviewer@postgres:5432/docviewer?sslmode=disable"
      SALES_MOCK_URL: "http://sales-mock:8080"
      SERVICE_MOCK_URL: "http://service-mock:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sales-mock:
        condition: service_healthy
      service-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:2.2.0
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:16687"]
      interval: 3s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
